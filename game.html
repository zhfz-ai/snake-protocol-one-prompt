<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNAKE PROTOCOL — neon snake that plays itself when idle</title>
<style>
  html, body { margin: 0; background: #070812; color: #e8f6ff; font-family: ui-monospace, Menlo, Consolas, monospace; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 32px; text-align: center; }
  h1 { font-size: 28px; letter-spacing: 3px; margin: 8px 0 4px; color: #37f2a2; text-shadow: 0 0 18px #37f2a288; }
  p.sub { margin: 0 0 14px; color: #9db8d2; font-size: 14px; }
  canvas { background: #0b0e1d; border: 2px solid #26325e; border-radius: 10px; box-shadow: 0 0 30px #37f2a233; max-width: 100%; height: auto; touch-action: none; }
  .hud { display: flex; justify-content: center; gap: 22px; margin: 12px 0 6px; font-size: 15px; }
  .hud b { color: #ffd166; }
  .keys { color: #9db8d2; font-size: 13px; margin-top: 8px; }
  button { background: #37f2a2; color: #06130c; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>SNAKE PROTOCOL</h1>
  <p class="sub">Neon snake that plays itself when you idle. Speeds up every 5 apples. One file, no libraries.</p>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>SPEED <b id="speed">1x</b></span><span id="mode">AUTO-DEMO</span></div>
  <div class="keys">Arrows / WASD to take over &middot; Space pauses &middot; swipe on touch &middot; idle 4s = the agent drives</div>
  <button id="restart" type="button">Restart</button>
</main>
<script>
"use strict";
const CELL = 20, COLS = 24, ROWS = 24;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const speedEl = document.getElementById("speed");
const modeEl = document.getElementById("mode");
let snake, dir, nextDir, apple, score, best, speedTier, lastInput, paused, dead, tickMs, lastTick;

function reset() {
  snake = [{ x: 11, y: 12 }, { x: 10, y: 12 }, { x: 9, y: 12 }];
  dir = { x: 1, y: 0 }; nextDir = dir;
  score = 0; speedTier = 1; paused = false; dead = false;
  lastInput = performance.now() - 5000; // start in auto-demo so the game moves on load
  placeApple(); syncHud();
}
function placeApple() {
  while (true) {
    const p = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
    if (!snake.some(s => s.x === p.x && s.y === p.y)) { apple = p; return; }
  }
}
function syncHud() {
  scoreEl.textContent = String(score);
  bestEl.textContent = String(best || 0);
  speedEl.textContent = speedTier + "x";
  modeEl.textContent = paused ? "PAUSED" : (performance.now() - lastInput > 4000 ? "AUTO-DEMO" : "YOU DRIVE");
}
function aiStep() {
  const head = snake[0];
  const options = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }]
    .filter(d => !(d.x === -dir.x && d.y === -dir.y));
  let bestMove = null, bestCost = Infinity;
  for (const d of options) {
    const nx = head.x + d.x, ny = head.y + d.y;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
    if (snake.some(s => s.x === nx && s.y === ny)) continue;
    const cost = Math.abs(nx - apple.x) + Math.abs(ny - apple.y);
    if (cost < bestCost) { bestCost = cost; bestMove = d; }
  }
  if (bestMove) nextDir = bestMove;
}
function step() {
  if (paused || dead) return;
  if (performance.now() - lastInput > 4000) aiStep();
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
    dead = true; best = Math.max(best || 0, score); syncHud(); return;
  }
  snake.unshift(head);
  if (head.x === apple.x && head.y === apple.y) {
    score += 10; speedTier = 1 + ((score / 50) | 0); placeApple();
  } else snake.pop();
  syncHud();
}
function draw() {
  ctx.fillStyle = "#0b0e1d"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#141a33"; ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke(); }
  for (let i = 1; i < ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke(); }
  ctx.fillStyle = "#ff5470"; ctx.shadowColor = "#ff5470"; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(apple.x * CELL + 10, apple.y * CELL + 10, 7, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#a7ffd9" : "#37f2a2";
    ctx.shadowColor = "#37f2a2"; ctx.shadowBlur = i === 0 ? 16 : 8;
    ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
  });
  ctx.shadowBlur = 0;
  if (dead) {
    ctx.fillStyle = "rgba(7,8,18,0.78)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#e8f6ff"; ctx.font = "bold 30px ui-monospace, monospace"; ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 8);
    ctx.font = "16px ui-monospace, monospace"; ctx.fillText("Score " + score + " — press Restart", canvas.width / 2, canvas.height / 2 + 24);
  }
}
function loop(now) {
  const interval = Math.max(55, 130 - (speedTier - 1) * 15);
  if (!lastTick || now - lastTick >= interval) { step(); lastTick = now; }
  draw(); requestAnimationFrame(loop);
}
function steer(x, y) {
  if (x === -dir.x && y === -dir.y) return;
  nextDir = { x, y }; lastInput = performance.now(); syncHud();
}
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowup" || k === "w") steer(0, -1);
  else if (k === "arrowdown" || k === "s") steer(0, 1);
  else if (k === "arrowleft" || k === "a") steer(-1, 0);
  else if (k === "arrowright" || k === "d") steer(1, 0);
  else if (k === " ") { paused = !paused; e.preventDefault(); }
  if (k.startsWith("arrow")) e.preventDefault();
});
let touchStart = null;
canvas.addEventListener("touchstart", e => { touchStart = e.touches[0]; }, { passive: true });
canvas.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0], dx = t.clientX - touchStart.clientX, dy = t.clientY - touchStart.clientY;
  if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1, 0); else steer(0, dy > 0 ? 1 : -1);
  touchStart = null;
}, { passive: true });
document.getElementById("restart").addEventListener("click", reset);
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
